spring:
  application:
    name: edusync
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/quan_ly_sinh_vien}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Ho_Chi_Minh
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /test
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
app:
  demo:
    enabled: ${DEMO_ENABLED:true}
  admin:
    username: ${ADMIN_USERNAME:admin@educare.edu.vn}
    password: ${ADMIN_PASSWORD:admin123}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
